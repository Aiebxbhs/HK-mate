[project]
name = "hkumailmate"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.15,<2",
  "pwdlib[argon2]>=0.2,<1",
  "email-validator>=2.2,<3",
  "google-auth-oauthlib>=1.2,<2",
  "cryptography>=44",
  "httpx>=0.28,<1",
  "icalendar>=6,<8",
  "websockets>=17.4,<18",
]

[dependency-groups]
# Benchmark-only tools (docs/LECTURE_BENCH.md): data loading, scoring, small MT models.
bench = [
    "ctranslate2>=4.9.0",
    "jiwer>=4.0.0",
    "pyarrow>=26.0.1",
    "sacrebleu>=2.6.0",
    "sentencepiece>=0.2.3",
    "transformers>=5.23.0",
]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]
# Runtime for lecture speech recognition.
speech = [
    "mlx-whisper>=0.4.3",
    "soundfile>=0.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
